version: '3.9'
services:
  chroma:
    image: chromadb/chroma
    ports:
      - "8000:8000"
    environment:
      - ALLOW_RESET=TRUE
    volumes:
      - chroma_storage:/chroma/chroma

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  chroma_storage:
  qdrant_storage:
